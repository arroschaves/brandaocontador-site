name: Project Quality & Health

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Verify Secrets
      run: |
        if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
          echo "::error::NEXT_PUBLIC_SUPABASE_URL is missing. Please add it to GitHub Secrets."
          exit 1
        fi
        if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
          echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY is missing. Please add it to GitHub Secrets."
          exit 1
        fi

    - name: Install dependencies
      run: npm install
      
    - name: Run Project Health Check
      run: node scripts/project-health.js
      
    - name: Security Scan
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        
    - name: Next.js Build Check
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
